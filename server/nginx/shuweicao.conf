# /etc/nginx/sites-available/shuweicao.conf
# 证书：Cloudflare 源站证书（覆盖 shuweicao.org 和 *.shuweicao.org）
#   /etc/ssl/cloudflare/origin.pem   /etc/ssl/cloudflare/origin.key
# 真实客户端 IP：见 /etc/nginx/conf.d/cloudflare-realip.conf（由 cloudflare-ips.sh 生成）

# 80 端口：全部跳 HTTPS（Cloudflare 一般已经跳了，这里兜底）
server {
    listen 80;
    listen [::]:80;
    server_name shuweicao.org www.shuweicao.org pay.shuweicao.org;
    return 301 https://$host$request_uri;
}

# www → 主域名
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shuweicao.org;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    return 301 https://shuweicao.org$request_uri;
}

# 商城：前台 + 后台（隐藏路径）+ API + 支付回调
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shuweicao.org;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    access_log /var/log/nginx/shuweicao.access.log;
    error_log  /var/log/nginx/shuweicao.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# USDT 收银台（BEpusdt）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pay.shuweicao.org;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/pay.access.log;
    error_log  /var/log/nginx/pay.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
