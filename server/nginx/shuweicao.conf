# /etc/nginx/sites-available/shuweicao.conf —— 由 03-enable-site.sh 生成，证书路径会被替换
# 证书：默认 Cloudflare 源站证书（覆盖 shuweicao.org 和 *.shuweicao.org）
#   /etc/ssl/cloudflare/origin.pem   /etc/ssl/cloudflare/origin.key
#   服务器上已有 Let's Encrypt 证书时，脚本改用 /etc/letsencrypt/live/<域名>/；行尾带 PAY_CERT / PAY_KEY 的是 pay 子域专用
# 证书验证（Let's Encrypt webroot）：所有站点的 /.well-known/acme-challenge/ 都从 /var/www/html 读文件。
#   Cloudflare 会把 http 强制跳到 https，所以 80 和 443 两边都要放行，否则证书续期会失败
# 真实客户端 IP：见 /etc/nginx/conf.d/cloudflare-realip.conf（由 cloudflare-ips.sh 生成）

# 80 端口：证书验证 + 其余全部跳 HTTPS（Cloudflare 一般已经跳了，这里兜底）
server {
    listen 80;
    listen [::]:80;
    server_name shuweicao.org www.shuweicao.org pay.shuweicao.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# www → 主域名
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shuweicao.org;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://shuweicao.org$request_uri;
    }
}

# 商城：前台 + 后台（隐藏路径）+ API + 支付回调
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shuweicao.org;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    access_log /var/log/nginx/shuweicao.access.log;
    error_log  /var/log/nginx/shuweicao.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# 加密货币收银台 + 后台（BEpusdt，USDT / USDC）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pay.shuweicao.org;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;   # PAY_CERT
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;   # PAY_KEY
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/pay.access.log;
    error_log  /var/log/nginx/pay.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
